experiment:
  name: null

model:
  model_name_or_path: models/Qwen2.5-1.5B-Instruct
  max_length: 2048
  bf16: true

data:
  train_paths:
    - datasets/task1/plan_a_train.jsonl
    - datasets/task1/plan_a_train.jsonl
    - datasets/task1/qwen-3.5-9b_plan_b_correct_clean_train.jsonl
    - datasets/task1/plan_b_clean_train.jsonl
  dev_ratio: 0.0

train:
  batch_size: 6
  num_epochs: 3
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_accumulation_steps: 1
  grad_clip: 1.0
  seed: 3407
  num_workers: 8

logging:
  log_steps: 10
  save_steps: 200
  use_swanlab: true
  swanlab_project: cs60004-lab1-task2

output:
  output_root: outputs/task2


