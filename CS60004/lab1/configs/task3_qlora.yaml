experiment:
  name: null

model:
  model_name_or_path: models/Qwen2.5-1.5B-Instruct
  max_length: 2048
  bf16: true
  quantization:
    enabled: true
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_use_double_quant: true

data:
  train_paths:
    - datasets/task1/plan_b_clean_train.jsonl
  dev_ratio: 0.1

train:
  batch_size: 4
  num_epochs: 15
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_accumulation_steps: 8
  grad_clip: 1.0
  seed: 3407
  num_workers: 4

peft:
  method: qlora
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

logging:
  log_steps: 10
  save_steps: 200
  use_swanlab: true
  swanlab_project: cs60004-lab1-task3

output:
  output_root: outputs/task3_qlora

